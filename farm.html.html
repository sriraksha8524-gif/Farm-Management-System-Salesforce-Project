<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🌾 Farm Management System</h1>
    <p>Manage Farms, Crops, Farmers and Buyers</p>
</header>

<nav>
    <button onclick="showSection('dashboard')">Dashboard</button>
    <button onclick="showSection('farm')">Farm</button>
    <button onclick="showSection('crop')">Crop</button>
    <button onclick="showSection('farmer')">Farmer</button>
    <button onclick="showSection('buyer')">Buyer</button>
    <button onclick="showSection('records')">Records</button>
</nav>

<main>

    <!-- DASHBOARD -->
    <section id="dashboard" class="section active">
        <h2>Dashboard</h2>

        <div class="cards">
            <div class="card">
                <h3>Farms</h3>
                <p id="farmCount">0</p>
            </div>

            <div class="card">
                <h3>Crops</h3>
                <p id="cropCount">0</p>
            </div>

            <div class="card">
                <h3>Farmers</h3>
                <p id="farmerCount">0</p>
            </div>

            <div class="card">
                <h3>Buyers</h3>
                <p id="buyerCount">0</p>
            </div>
        </div>
    </section>


    <!-- FARM -->
    <section id="farm" class="section">
        <h2>Farm Management</h2>

        <form onsubmit="addRecord(event, 'farm')">

            <input type="text" name="name"
                   placeholder="Farm Name" required>

            <select name="type" required>
                <option value="">Select Farm Type</option>
                <option>Crop</option>
                <option>Livestock</option>
                <option>Mixed</option>
            </select>

            <select name="soil" required>
                <option value="">Select Soil Quality</option>
                <option>Organic</option>
                <option>Cover Crops</option>
                <option>Composting</option>
            </select>

            <select name="irrigation" required>
                <option value="">Select Irrigation Type</option>
                <option>Sprinkler irrigation</option>
                <option>Drip irrigation</option>
                <option>Localized irrigation</option>
            </select>

            <input type="text" name="location"
                   placeholder="Location" required>

            <input type="number" name="size"
                   placeholder="Farm Size (Acres)" required>

            <button type="submit">Add Farm</button>
        </form>
    </section>


    <!-- CROP -->
    <section id="crop" class="section">
        <h2>Crop Management</h2>

        <form onsubmit="addRecord(event, 'crop')">

            <input type="text" name="name"
                   placeholder="Crop Name" required>

            <input type="date" name="plantingDate"
                   required>

            <input type="date" name="harvestDate"
                   required>

            <input type="number" step="0.01"
                   name="actualYield"
                   placeholder="Actual Yield" required>

            <input type="number" step="0.01"
                   name="acres"
                   placeholder="Total Acres Harvested" required>

            <input type="text" name="farm"
                   placeholder="Farm Name" required>

            <button type="submit">Add Crop</button>
        </form>
    </section>


    <!-- FARMER -->
    <section id="farmer" class="section">
        <h2>Farmer Management</h2>

        <form onsubmit="addRecord(event, 'farmer')">

            <input type="text" name="name"
                   placeholder="Farmer Name" required>

            <input type="tel" name="contact"
                   placeholder="Contact Number" required>

            <select name="state" required>
                <option value="">Select State</option>
                <option>Tamilnadu</option>
                <option>Andhra Pradesh</option>
                <option>Telangana</option>
            </select>

            <input type="text" name="district"
                   placeholder="District" required>

            <input type="text" name="village"
                   placeholder="Village" required>

            <button type="submit">Add Farmer</button>
        </form>
    </section>


    <!-- BUYER -->
    <section id="buyer" class="section">
        <h2>Buyer Management</h2>

        <form onsubmit="addRecord(event, 'buyer')">

            <input type="text" name="name"
                   placeholder="Buyer Name" required>

            <input type="tel" name="contact"
                   placeholder="Contact Number" required>

            <input type="email" name="email"
                   placeholder="Email" required>

            <textarea name="address"
                      placeholder="Address"
                      required></textarea>

            <select name="buyerType" required>
                <option value="">Select Buyer Type</option>
                <option>Wholesale</option>
                <option>Retail</option>
            </select>

            <button type="submit">Add Buyer</button>
        </form>
    </section>


    <!-- RECORDS -->
    <section id="records" class="section">

        <h2>Farm Records</h2>

        <select id="recordType"
                onchange="loadRecords()">

            <option value="farm">Farms</option>
            <option value="crop">Crops</option>
            <option value="farmer">Farmers</option>
            <option value="buyer">Buyers</option>

        </select>

        <div id="recordTable"></div>

    </section>

</main>


<footer>
    <p>Farm Management System | Web Application</p>
</footer>


<script>

function showSection(id) {

    document.querySelectorAll(".section")
        .forEach(section => {
            section.classList.remove("active");
        });

    document.getElementById(id)
        .classList.add("active");

    if (id === "dashboard") {
        loadDashboard();
    }

    if (id === "records") {
        loadRecords();
    }
}


async function addRecord(event, type) {

    event.preventDefault();

    const form = event.target;

    const formData = new FormData(form);

    const params = new URLSearchParams();

    params.append("type", type);

    for (const [key, value] of formData.entries()) {
        params.append(key, value);
    }

    const response = await fetch("/api/add", {
        method: "POST",
        headers: {
            "Content-Type":
                "application/x-www-form-urlencoded"
        },
        body: params
    });

    const result = await response.text();

    alert(result);

    form.reset();

    loadDashboard();
}


async function loadDashboard() {

    const response =
        await fetch("/api/stats");

    const data =
        await response.json();

    document.getElementById("farmCount")
        .innerText = data.farms;

    document.getElementById("cropCount")
        .innerText = data.crops;

    document.getElementById("farmerCount")
        .innerText = data.farmers;

    document.getElementById("buyerCount")
        .innerText = data.buyers;
}


async function loadRecords() {

    const type =
        document.getElementById("recordType").value;

    const response =
        await fetch("/api/data?type=" + type);

    const records =
        await response.json();

    let html = "<table>";

    if (records.length === 0) {

        html += `
            <tr>
                <td>No records available</td>
            </tr>
        `;

    } else {

        html += "<tr>";

        Object.keys(records[0]).forEach(key => {
            html += `<th>${key}</th>`;
        });

        html += "<th>Action</th>";
        html += "</tr>";

        records.forEach(record => {

            html += "<tr>";

            Object.keys(record).forEach(key => {

                html += `<td>${record[key]}</td>`;

            });

            html += `
                <td>
                    <button
                    onclick="deleteRecord('${type}',
                    '${record.id}')">
                    Delete
                    </button>
                </td>
            `;

            html += "</tr>";
        });
    }

    html += "</table>";

    document.getElementById("recordTable")
        .innerHTML = html;
}


async function deleteRecord(type, id) {

    if (!confirm("Delete this record?")) {
        return;
    }

    const params =
        new URLSearchParams();

    params.append("type", type);
    params.append("id", id);

    const response =
        await fetch("/api/delete", {
            method: "POST",
            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded"
            },
            body: params
        });

    alert(await response.text());

    loadRecords();
    loadDashboard();
}


loadDashboard();

</script>

</body>
</html>
